name: First Worfklow
on:
  push:
    branches: [develop]
  pull_request:
    branches:
      - develop
jobs:
  first_job:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Message
        run: echo "Welcome to the GitHub Actions"
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Git Repository Information
        run: |
          echo "Repository Name: ${{github.reposity}}"
          echo "Repository Owner: ${{github.reposity_owner}}"
          echo "Event Name: ${{github.event_name}}"
          git branch
          git branch -a 
          git log 
